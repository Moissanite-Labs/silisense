[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silisense"
version = "0.1.0"
description = "Fail-closed silicon physics profiler, precursor rail governor, and anti-Goodhart EDP kernel autotuner (Track S115 / HoloSphere sibling)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
accel = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
silisense-bench = "silisense.benchmarks.prereg_s115_suite:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["silisense*"]
